<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Interactive Phone</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Smartphone Outer Chassis -->
  <div class="phone-frame">
    <!-- Dynamic Island Notch -->
    <div class="dynamic-island"></div>

    <!-- Screen Area -->
    <div class="phone-screen">
      <!-- Status Bar -->
      <div class="status-bar">
        <span id="carrier">GLOBE</span>
        <div class="status-icons">
          <div class="battery"><div class="battery-level"></div></div>
        </div>
      </div>

      <!-- iOS Lock Screen -->
      <div id="lock-screen" class="lock-screen">
        <div class="lock-top-content">
          <div class="lock-date" id="lock-date">Tue Nov 10</div>
          <div class="lock-time" id="lock-time">7:47</div>
        </div>
        
        <!-- Passcode Overlay -->
        <div id="passcode-container" class="passcode-container hidden">
          <p class="passcode-prompt">Enter Passcode</p>
          <div class="dots-container" id="dots-container">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
          <div class="numpad">
            <button class="num-btn" onclick="pressNum('1')">1</button>
            <button class="num-btn" onclick="pressNum('2')">2</button>
            <button class="num-btn" onclick="pressNum('3')">3</button>
            <button class="num-btn" onclick="pressNum('4')">4</button>
            <button class="num-btn" onclick="pressNum('5')">5</button>
            <button class="num-btn" onclick="pressNum('6')">6</button>
            <button class="num-btn" onclick="pressNum('7')">7</button>
            <button class="num-btn" onclick="pressNum('8')">8</button>
            <button class="num-btn" onclick="pressNum('9')">9</button>
            <button class="num-btn empty"></button>
            <button class="num-btn" onclick="pressNum('0')">0</button>
            <button class="num-btn text-btn" onclick="deleteNum()">Delete</button>
          </div>
        </div>

        <!-- Lockscreen Bottom Footer (Flashlight, Camera, Single Swipe Bar) -->
        <div id="lock-footer" class="lock-footer">
          <div class="lock-shortcuts">
            <button class="shortcut-btn" onclick="toggleFlashlight(event)">🔦</button>
            <button class="shortcut-btn" onclick="openCamera()">📷</button>
          </div>
          <div class="swipe-bar"></div>
        </div>
      </div>

      <!-- Home Screen Grid -->
      <div id="home-screen" class="screen active">
        <div class="app-grid">
          <button class="app-icon" onclick="openApp('music-app')">
            <span class="icon">🎵</span>
            <span class="label">Music</span>
          </button>
          <button class="app-icon" onclick="openApp('gallery-app')">
            <span class="icon">🖼️</span>
            <span class="label">Gallery</span>
          </button>
          <button class="app-icon" onclick="openApp('notes-app')">
            <span class="icon">📝</span>
            <span class="label">Notes</span>
          </button>
        </div>
      </div>

      <!-- App Windows -->
      <div id="music-app" class="app-window">
        <div class="app-header">
          <button onclick="closeApp()">‹ Home</button>
          <span>Music Player</span>
        </div>
        <div class="app-body">
          <div class="album-art">🎶</div>
          <h3>Favorite Track</h3>
          <p>Artist Name</p>
          <button id="play-btn" onclick="togglePlay()">Play / Pause</button>
        </div>
      </div>

      <div id="gallery-app" class="app-window">
        <div class="app-header">
          <button onclick="closeApp()">‹ Home</button>
          <span>Gallery</span>
        </div>
        <div class="app-body gallery-grid">
          <div class="photo">🌸</div>
          <div class="photo">🌊</div>
          <div class="photo">✨</div>
          <div class="photo">🎨</div>
        </div>
      </div>

      <div id="notes-app" class="app-window">
        <div class="app-header">
          <button onclick="closeApp()">‹ Home</button>
          <span>Notes</span>
        </div>
        <div class="app-body">
          <textarea placeholder="Write a note..."></textarea>
        </div>
      </div>

      <!-- Home Gesture Bar -->
      <div class="home-bar" onclick="closeApp()"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
