<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Interactive iOS Phone</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Smartphone Outer Chassis -->
  <div class="phone-frame">
    <!-- Dynamic Island Notch -->
    <div class="dynamic-island"></div>

    <!-- Screen Area -->
    <div class="phone-screen">
      <!-- Status Bar -->
      <div class="status-bar">
        <span id="carrier">GLOBE</span>
        <div class="status-icons">
          <div class="battery"><div class="battery-level"></div></div>
        </div>
      </div>

      <!-- iOS Lock Screen -->
      <div id="lock-screen" class="lock-screen">
        <div class="lock-top-content">
          <div class="lock-date" id="lock-date">Tue, Nov 10</div>
          <div class="lock-time" id="lock-time">7:55</div>
        </div>
        
        <!-- Passcode Overlay -->
        <div id="passcode-container" class="passcode-container hidden">
          <div class="passcode-header">
            <p class="passcode-prompt">Enter Passcode</p>
            <div class="dots-container" id="dots-container">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </div>

          <!-- iOS Numpad with Letters & No Empty Placeholders -->
          <div class="numpad">
            <button class="num-btn" onclick="pressNum('1')"><strong>1</strong></button>
            <button class="num-btn" onclick="pressNum('2')"><strong>2</strong><span>ABC</span></button>
            <button class="num-btn" onclick="pressNum('3')"><strong>3</strong><span>DEF</span></button>
            <button class="num-btn" onclick="pressNum('4')"><strong>4</strong><span>GHI</span></button>
            <button class="num-btn" onclick="pressNum('5')"><strong>5</strong><span>JKL</span></button>
            <button class="num-btn" onclick="pressNum('6')"><strong>6</strong><span>MNO</span></button>
            <button class="num-btn" onclick="pressNum('7')"><strong>7</strong><span>PQRS</span></button>
            <button class="num-btn" onclick="pressNum('8')"><strong>8</strong><span>TUV</span></button>
            <button class="num-btn" onclick="pressNum('9')"><strong>9</strong><span>WXYZ</span></button>
            <button class="num-btn center-zero" onclick="pressNum('0')"><strong>0</strong></button>
          </div>

          <!-- Passcode Bottom Bar (Emergency & Cancel) -->
          <div class="passcode-footer">
            <button class="text-action-btn" onclick="alert('Emergency call simulated')">Emergency</button>
            <button class="text-action-btn" onclick="cancelPasscode()">Cancel</button>
          </div>
        </div>

        <!-- Lockscreen Bottom Shortcuts -->
        <div id="lock-footer" class="lock-footer">
          <div class="lock-shortcuts">
            <button class="shortcut-btn" onclick="toggleFlashlight(event)">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <path d="M7 2h10a1 1 0 0 1 1 1v3.5a1 1 0 0 1-.3.7L15 10v11a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V10L6.3 7.2A1 1 0 0 1 6 6.5V3a1 1 0 0 1 1-1zm2 2v2h6V4H9zm3 7a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/>
              </svg>
            </button>
            <button class="shortcut-btn" onclick="openCamera()">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Home Screen Grid -->
      <div id="home-screen" class="screen">
        <div class="app-grid">
          <button class="app-icon" onclick="openApp('music-app')">
            <span class="icon">🎵</span>
            <span class="label">Music</span>
          </button>
          <button class="app-icon" onclick="openApp('gallery-app')">
            <span class="icon">🖼️</span>
            <span class="label">Gallery</span>
          </button>
          <button class="app-icon" onclick="openApp('notes-app')">
            <span class="icon">📝</span>
            <span class="label">Notes</span>
          </button>
        </div>
      </div>

      <!-- App Windows -->
      <div id="music-app" class="app-window">
        <div class="app-header">
          <button onclick="closeApp()">‹ Home</button>
          <span>Music Player</span>
        </div>
        <div class="app-body">
          <div class="album-art">🎶</div>
          <h3>Favorite Track</h3>
          <p>Artist Name</p>
          <button id="play-btn" onclick="togglePlay()">Play / Pause</button>
        </div>
      </div>

      <div id="gallery-app" class="app-window">
        <div class="app-header">
          <button onclick="closeApp()">‹ Home</button>
          <span>Gallery</span>
        </div>
        <div class="app-body gallery-grid">
          <div class="photo">🌸</div>
          <div class="photo">🌊</div>
          <div class="photo">✨</div>
          <div class="photo">🎨</div>
        </div>
      </div>

      <div id="notes-app" class="app-window">
        <div class="app-header">
          <button onclick="closeApp()">‹ Home</button>
          <span>Notes</span>
        </div>
        <div class="app-body">
          <textarea placeholder="Write a note..."></textarea>
        </div>
      </div>

      <!-- Universal Home Bar -->
      <div class="universal-home-bar" onclick="closeApp()"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
